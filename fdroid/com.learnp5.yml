AutoName: Learn P5
Summary: Learn p5.js offline with interactive coding exercises
Description: |-
  Learn P5 is an offline-first Android app for learning p5.js through small
  coding exercises. Each exercise presents a task with a live canvas preview,
  a CodeMirror 6 editor with p5.js-aware autocomplete and syntax highlighting,
  and a context-aware keyboard. Exercises are validated against the p5.js
  reference and unlock sequentially. The app ships with vendored p5.js and
  embedded reference data so it works without a network connection.

RepoType: git
Repo: https://github.com/prjctimg/learn-p5.git

Builds:
  - versionName: 0.6.135
    versionCode: 130
    commit: REPLACE_WITH_FULL_COMMIT_HASH
    subdir: .
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init: npm ci
    gradle:
      - assembleRelease
    prebuild: npx expo prebuild --platform android --no-install
    ndk: r27c
    scanignore:
      - node_modules
    scandelete:
      - node_modules

MaintainerNotes: |-
  The app bundles p5.js (LGPL-2.1) and p5.js website reference/examples
  (CC BY-NC-SA 4.0). These are treated as non-free assets.

