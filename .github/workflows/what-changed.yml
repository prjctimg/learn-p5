name: What changed

on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout automata scripts
        uses: actions/checkout@v7
        with:
          repository: prjctimg/automata
          path: automata
          ref: main

      - name: Generate report
        id: report
        run: |
          SINCE="7 days ago"
          python3 automata/scripts/what-changed.py --since "${SINCE:-7 days ago}" --out what-changed.md
          if grep -q "<!-- what-changed: empty -->" what-changed.md; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue
        if: steps.report.outputs.empty != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('what-changed.md', 'utf8');
            const title = `What changed — ${new Date().toISOString().slice(0,10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
