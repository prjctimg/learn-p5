name: Update GitHub Actions

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPDATED=false
          for i in 1 2 3; do
            echo "Attempt $i to update GitHub Actions..."
            if npx --yes actions-up@2.0.0 --yes --style preserve; then
              UPDATED=true
              break
            fi
            if [ "$i" -lt 3 ]; then sleep 10; fi
          done
          if [ "$UPDATED" != "true" ]; then
            echo "Failed to update GitHub Actions after 3 attempts"
            exit 1
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-actions
          title: "chore: update GitHub Actions"
          commit-message: "chore: update GitHub Actions"
          delete-branch: true