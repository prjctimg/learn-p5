name: Build & Publish Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate editor bundle
        run: npm run bundle-editor

      - name: Run checks
        run: npm run check

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"
          test -d "$ANDROID_SDK_ROOT/ndk/27.1.12297006"

      - name: Prebuild native project
        run: npx expo prebuild --platform android --clean

      - name: Configure ABI splits for per-architecture APKs
        run: |
          sed -i '/android {/a\
              splits {\
                  abi {\
                      enable true\
                      reset()\
                      include "arm64-v8a", "armeabi-v7a"\
                      universalApk false\
                  }\
              }' android/app/build.gradle

      - name: Build release APKs (per ABI)
        run: cd android && ./gradlew assembleRelease

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease

      - name: List build artifacts
        run: find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \)

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
