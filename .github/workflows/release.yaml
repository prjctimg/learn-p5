name: Build & Publish Release APK

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify release signing secrets
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          NPM_INSTALLED=false
          for i in 1 2 3; do
            echo "Attempt $i to install npm dependencies..."
            if npm ci; then
              NPM_INSTALLED=true
              echo "npm ci succeeded"
              break
            fi
            echo "npm ci failed (attempt $i)"
            if [ $i -lt 3 ]; then sleep 10; fi
          done
          if [ "$NPM_INSTALLED" != "true" ]; then
            echo "Failed to install npm dependencies after 3 attempts"
            exit 1
          fi

      - name: Regenerate CodeMirror bundle
        run: npm run bundle-editor

      - name: Run invariant checks and tests
        run: npm run check

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          NDK_INSTALLED=false
          for i in 1 2 3; do
            echo "Attempt $i to install NDK 27.1.12297006..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
              --install "ndk;27.1.12297006" || { echo "SDK manager failed"; sleep 10; continue; }
            NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.1.12297006"
            if [ -d "$NDK_DIR" ]; then
              echo "NDK installed successfully at $NDK_DIR"
              NDK_INSTALLED=true
              break
            fi
            echo "NDK directory not found, retrying..."
            sleep 10
          done
          if [ "$NDK_INSTALLED" != "true" ]; then
            echo "Failed to install NDK after 3 attempts"
            exit 1
          fi

      - name: Prebuild native project
        run: |
          PREBUILT=false
          for i in 1 2 3; do
            echo "Attempt $i to prebuild native project..."
            npx expo prebuild --platform android --clean && PREBUILT=true && break
            echo "prebuild failed (attempt $i)"
            if [ $i -lt 3 ]; then sleep 10; fi
          done
          if [ "$PREBUILT" != "true" ]; then
            echo "Failed to prebuild native project after 3 attempts"
            exit 1
          fi

      - name: Configure ABI splits for per-architecture APKs
        run: |
          sed -i '/android {/a\
          \    splits {\
          \        abi {\
          \            enable true\
          \            reset()\
          \            include "arm64-v8a", "armeabi-v7a"\
          \            universalApk false\
          \        }\
          \    }' android/app/build.gradle

      - name: Build release APKs (per ABI)
        run: cd android && ./gradlew assembleRelease

      - name: Setup keystore for signing
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Sign and verify APKs
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK"
            exit 1
          fi
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "Signing $apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "${apk%.apk}-signed.apk" \
              "$apk"
            mv "${apk%.apk}-signed.apk" "$apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: List split APKs
        run: find android -name "*.apk" -type f

      - name: Rename APKs for F-Droid (learn-p5-{versionName}-{arch}.apk)
        run: |
          VERSION_NAME="${{ github.ref_name }}"
          VERSION_NAME="${VERSION_NAME#v}"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            dir=$(dirname "$apk")
            base=$(basename "$apk")
            arch=$(echo "$base" | sed -n 's/.*\(arm64-v8a\|armeabi-v7a\).*/\1/p')
            [ -z "$arch" ] && arch=universal
            mv "$apk" "$dir/learn-p5-${VERSION_NAME}-${arch}.apk"
          done

      - name: Upload split APKs to release
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true