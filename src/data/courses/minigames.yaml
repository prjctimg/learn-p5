  # 10. Perlin Maze (after random-noise)
  - id: perlin-maze
    title: "Perlin Maze"
    description: "Navigate through procedurally generated mazes! Use noise for unique layouts."
    courseSlug: random-noise
    gameType: "2d"
    targetScore: 3
    achievementId: maze-master
    unlockExercise:
      id: unlock-perlin
      title: "Perlin Maze Basics"
      module: Random & Noise
      description: "Learn noise concepts for Perlin Maze"
      instruction: |
        Perlin Maze uses noise() and map() for maze generation.
        Complete these tasks to unlock the game.
      startingCode: |
        function setup() {
          createCanvas(400, 400);
          background(0);
        }

        function draw() {
          // Your code here
        }
      solution: |
        function setup() {
          createCanvas(400, 400);
          background(0);
        }

        function draw() {
          background(0);
          noStroke();
          for (let x = 0; x < 400; x += 20) {
            for (let y = 0; y < 400; y += 20) {
              let n = noise(x * 0.05, y * 0.05);
              let g = map(n, 0, 1, 0, 255);
              if (n > 0.5) {
                fill(g);
                rect(x, y, 20, 20);
              }
            }
          }
        }
      tasks:
        - id: task-1
          title: "Noise Grid"
          instruction: |
            Use noise() with map() to generate grayscale values.
          validation:
            - type: functionCall
              name: noise
              minArgs: 2
            - type: functionCall
              name: map
              minArgs: 5
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            function draw() {
              background(0);
              let n = noise(100, 200);
              let g = map(n, 0, 1, 0, 255);
              fill(g);
              rect(0, 0, 400, 400);
            }
        - id: task-2
          title: "Maze Walls"
          instruction: |
            Draw maze walls using rect() based on noise thresholds.
          validation:
            - type: functionCall
              name: rect
              minArgs: 4
            - type: functionCall
              name: noise
              minArgs: 2
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            function draw() {
              background(0);
              noStroke();
              let n = noise(10, 20);
              if (n > 0.5) {
                fill(255);
                rect(0, 0, 20, 20);
              }
            }

