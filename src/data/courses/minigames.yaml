          stroke(0);
          strokeWeight(3);
          line(133, 20, 133, 380);
          line(266, 20, 266, 380);
          line(20, 133, 380, 133);
          line(20, 266, 380, 266);
          noFill();
          strokeWeight(4);
          drawX(66, 66);
          drawO(200, 66);
        }

        function drawX(x, y) {
          line(x - 20, y - 20, x + 20, y + 20);
          line(x + 20, y - 20, x - 20, y + 20);
        }

        function drawO(x, y) {
          circle(x, y, 50);
        }
