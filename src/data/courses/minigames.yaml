# Minigame Interludes
# Optional Symbian-era minigames between courses
# Each entry is a full Minigame plus its unlock exercise (2-3 tasks).

minigames:
  # 1. Snake Classic (after shapes)
  - id: snake-classic
    title: "Snake Classic"
    description: "Guide the snake to eat food and grow longer. Don't hit the walls or yourself!"
    courseSlug: shapes
    gameType: "2d"
    targetScore: 10
    achievementId: snake-master
    unlockExercise:
      id: unlock-snake
      title: "Snake Basics"
      module: Shapes
      description: "Learn the drawing concepts needed for Snake Classic"
      instruction: |
        Snake Classic uses rectangles for the snake and food.
        Complete these tasks to unlock the game.
      startingCode: |
        function setup() {
          createCanvas(400, 400);
          background(0);
        }

        function draw() {
          // Your code here
        }
      solution: |
        function setup() {
          createCanvas(400, 400);
          background(0);
        }

        function draw() {
          background(0);
          drawGrid();
          drawSnake();
          drawFood();
        }

        function drawGrid() {
          noStroke();
          fill(20);
          for (let x = 0; x < 400; x += 20) {
            for (let y = 0; y < 400; y += 20) {
              rect(x, y, 20, 20);
            }
          }
        }

        function drawSnake() {
          noStroke();
          fill(0, 255, 0);
          rect(100, 100, 20, 20);
        }

        function drawFood() {
          noStroke();
          fill(255, 0, 0);
          circle(200, 200, 15);
        }
      tasks:
        - id: task-1
          title: "Draw a Grid"
          instruction: |
            Draw a 20x20 grid on the canvas. Use rect() to lay out the grid cells.
          validation:
            - type: functionCall
              name: rect
              minArgs: 3
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            function draw() {
              background(0);
              noStroke();
              fill(20);
              for (let x = 0; x < 400; x += 20) {
                rect(x, 0, 20, 20);
              }
            }
        - id: task-2
          title: "Draw a Snake Segment"
          instruction: |
            Draw a green rectangle at position (100, 100) with size 20x20.
            This represents one segment of the snake.
          validation:
            - type: functionCall
              name: rect
              exactArgs: 4
            - type: pixelMatch
              x: 110
              y: 110
              expected: [0, 255, 0]
              tolerance: 50
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            function draw() {
              background(0);
              noStroke();
              fill(0, 255, 0);
              rect(100, 100, 20, 20);
            }
        - id: task-3
          title: "Draw Food"
          instruction: |
            Draw a red circle at position (200, 200) with diameter 15.
            This represents the food the snake eats.
          validation:
            - type: functionCall
              name: circle
              exactArgs: 3
            - type: pixelMatch
              x: 200
              y: 200
              expected: [255, 0, 0]
              tolerance: 50
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            function draw() {
              background(0);
              noStroke();
              fill(255, 0, 0);
              circle(200, 200, 15);
            }

