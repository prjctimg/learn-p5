  # 15. Minesweeper (after data)
  - id: minesweeper
    title: "Minesweeper"
    description: "Find all the mines! Use logic and numbers to clear the field safely."
    courseSlug: data
    gameType: "2d"
    targetScore: 5
    achievementId: minesweeper-master
    unlockExercise:
      id: unlock-minesweeper
      title: "Minesweeper Basics"
      module: Data
      description: "Learn data concepts for Minesweeper"
      instruction: |
        Minesweeper uses arrays and counting logic for the minefield.
        Complete these tasks to unlock the game.
      startingCode: |
        function setup() {
          createCanvas(400, 400);
          background(0);
        }

        function draw() {
          // Your code here
        }
      solution: |
        function setup() {
          createCanvas(400, 400);
          background(0);
        }

        let grid = [[0, 1, 0], [0, 0, 1], [1, 0, 0]];

        function draw() {
          background(0);
          let count = 0;
          for (let i = 0; i < grid.length; i++) {
            for (let j = 0; j < grid[i].length; j++) {
              if (grid[i][j] === 1) {
                count++;
              }
            }
          }
          fill(255);
          textSize(24);
          textAlign(CENTER);
          text("Mines: " + count, 200, 200);
        }
      tasks:
        - id: task-1
          title: "2D Array"
          instruction: |
            Create a 2D array with random mine placement values.
          validation:
            - type: functionCall
              name: random
              minArgs: 0
            - type: functionCall
              name: floor
              minArgs: 1
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            let grid = [
              [floor(random(2)), floor(random(2))],
              [floor(random(2)), floor(random(2))],
            ];

            function draw() {
              background(0);
            }
        - id: task-2
          title: "Count Mines"
          instruction: |
            Define a countMines() function that returns the number of mines in the grid,
            then display it with text().
          validation:
            - type: functionExists
              name: countMines
            - type: functionCall
              name: text
              minArgs: 3
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(0);
            }

            let grid = [[0, 1, 0], [0, 0, 1], [1, 0, 0]];

            function countMines() {
              let total = 0;
              for (let i = 0; i < grid.length; i++) {
                for (let j = 0; j < grid[i].length; j++) {
                  if (grid[i][j] === 1) {
                    total++;
                  }
                }
              }
              return total;
            }

            function draw() {
              background(0);
              fill(255);
              textSize(24);
              text("Mines: " + countMines(), 200, 200);
            }

