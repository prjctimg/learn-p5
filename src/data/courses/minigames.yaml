  # 4. Frozen Bubble (after custom-shapes)
  - id: frozen-bubble
    title: "Frozen Bubble"
    description: "Shoot bubbles and match colors to clear the board! Classic arcade puzzle."
    courseSlug: custom-shapes
    gameType: "2d"
    targetScore: 20
    achievementId: frozen-bubble-master
    unlockExercise:
      id: unlock-frozen-bubble
      title: "Frozen Bubble Basics"
      module: Custom Shapes
      description: "Learn custom shape concepts for Frozen Bubble"
      instruction: |
        Frozen Bubble uses custom bubble shapes with beginShape()/endShape().
        Complete these tasks to unlock the game.
      startingCode: |
        function setup() {
          createCanvas(400, 400);
          background(200, 220, 255);
        }

        function draw() {
          // Your code here
        }
      solution: |
        function setup() {
          createCanvas(400, 400);
          background(200, 220, 255);
        }

        function draw() {
          drawBubble(200, 200, 50, 255, 0, 0);
        }

        function drawBubble(x, y, r, rcol, gcol, bcol) {
          noStroke();
          fill(rcol, gcol, bcol);
          beginShape();
          for (let a = 0; a <= TWO_PI; a += 0.1) {
            vertex(x + r * cos(a), y + r * sin(a));
          }
          endShape(CLOSE);
        }
      tasks:
        - id: task-1
          title: "Draw a Bubble"
          instruction: |
            Use beginShape(), vertex(), and endShape() to draw a bubble-like shape.
          validation:
            - type: functionCall
              name: beginShape
            - type: functionCall
              name: vertex
              minArgs: 2
            - type: functionCall
              name: endShape
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(200, 220, 255);
            }

            function draw() {
              noStroke();
              fill(255, 100, 50);
              beginShape();
              vertex(150, 200);
              vertex(250, 200);
              vertex(200, 300);
              endShape(CLOSE);
            }
        - id: task-2
          title: "Colored Bubbles"
          instruction: |
            Draw 3 different colored bubbles in a row using fill().
          validation:
            - type: functionCall
              name: fill
              minArgs: 3
            - type: functionCall
              name: beginShape
          solution: |
            function setup() {
              createCanvas(400, 400);
              background(200, 220, 255);
            }

            function draw() {
              noStroke();
              fill(255, 0, 0);
              beginShape();
              vertex(100, 200);
              vertex(140, 200);
              vertex(120, 260);
              endShape(CLOSE);
              fill(0, 255, 0);
              beginShape();
              vertex(200, 200);
              vertex(240, 200);
              vertex(220, 260);
              endShape(CLOSE);
              fill(0, 0, 255);
              beginShape();
              vertex(300, 200);
              vertex(340, 200);
              vertex(320, 260);
              endShape(CLOSE);
            }

