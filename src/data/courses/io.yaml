slug: io
title: Loading Data
moduleName: Utility
description: "Load and display external data like JSON and images in your sketches."
exercises:
  - id: exercise-1
    title: "JSON Display"
    module: Loading Data
    description: "Load a JSON resource and display its values on canvas."
    instruction: |
      Use loadJSON() with an async setup() to load embedded data.
      In draw(), use text() to display data values on canvas.
    startingCode: |
      let data;

      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(240);
        fill(0);
        textSize(20);
        if (data) {
          text("Title: " + data.title, 50, 180);
          text("Completed: " + data.completed, 50, 220);
        } else {
          text("Loading...", 50, 200);
        }
      }
    solution: |
      let data;

      async function setup() {
        createCanvas(400, 400);
        data = await loadJSON("data:application/json;base64,eyJ1c2VySWQiOjEsImlkIjoxLCJ0aXRsZSI6ImRlbGVjdHVzIGF1dCBhdXRlbSIsImNvbXBsZXRlZCI6ZmFsc2V9");
      }

      function draw() {
        background(240);
        fill(0);
        textSize(20);
        if (data) {
          text("Title: " + data.title, 50, 180);
          text("Completed: " + data.completed, 50, 220);
        } else {
          text("Loading...", 50, 200);
        }
      }
    tasks:
      - id: task-1
        title: "Load and Display JSON"
        instruction: |
          Make setup() async and use await loadJSON() with the data: URL to load data.
          In draw(), check if data exists and display it with text().
        validation:
          - type: functionCall
            name: loadJSON
            minArgs: 1
          - type: functionCall
            name: text
            minArgs: 3
  - id: exercise-2
    title: "Image Loader"
    module: Loading Data
    description: "Load an image and display it on canvas."
    instruction: |
      Use loadImage() with an async setup() to load an embedded image.
      In draw(), use image() to draw it on canvas.
    startingCode: |
      let img;

      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(240);
      }

    solution: |
      let img;

      async function setup() {
        createCanvas(400, 400);
        img = await loadImage("data:image/png;base64,");
      }

      function draw() {
        background(240);
        image(img, 100, 100, 200, 200);
      }
    tasks:
      - id: task-1
        title: "Load and Draw Image"
        instruction: |
          Declare a variable img. Make setup() async and use await loadImage() with the data: URL.
          In draw(), display it with image(img, 100, 100, 200, 200).
        validation:
          - type: functionCall
            name: loadImage
            minArgs: 1
          - type: functionCall
            name: image
            minArgs: 3
  - id: exercise-3
    title: "String Loader"
    module: Loading Data
    description: "Load text data and display it on canvas."
    instruction: |
      Use loadStrings() with an async setup() to load embedded text.
      In draw(), join the array and display with text().
    startingCode: |
      let lines;

      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(240);
        fill(0);
        textSize(16);
      }

    solution: |
      let lines;

      async function setup() {
        createCanvas(400, 400);
        lines = await loadStrings("data:text/plain;base64,SGVsbG8gZnJvbSBwNSEKTGluZSAyOiBsb2FkaW5nIHRleHQgb2ZmbGluZS4KTGluZSAzOiBubyBuZXR3b3JrIG5lZWRlZC4=");
      }

      function draw() {
        background(240);
        fill(0);
        textSize(16);
        text(lines.join("\n"), 50, 50, 300, 300);
      }
    tasks:
      - id: task-1
        title: "Display Loaded Text"
        instruction: |
          Make setup() async and use await loadStrings() with the data: URL to store lines.
          In draw(), display with text(lines.join("\n"), 50, 50, 300, 300).
        validation:
          - type: functionCall
            name: loadStrings
            minArgs: 1
          - type: functionCall
            name: text
            minArgs: 3
