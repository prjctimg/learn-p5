        });
      }

      function draw() {
        background(240);
        fill(0);
        textSize(16);
        if (lines) {
          text(lines.join("\n"), 50, 50, 300, 300);
        } else {
          text("Loading...", 50, 200);
        }
      }
    tasks:
      - id: task-1
        title: "Display Loaded Text"
        instruction: |
          Use loadStrings() with a URL and callback to store lines.
          In draw(), check if lines exists and display with text(lines.join("\n"), 50, 50, 300, 300).
        validation:
          - type: functionCall
            name: loadStrings
            exactArgs: 2
          - type: functionCall
            name: text
            minArgs: 3
