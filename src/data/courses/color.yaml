slug: color
title: Color
moduleName: Fundamentals
description: "Learn to paint with code — fill, stroke, and background colors."
exercises:
  - id: exercise-1
    title: "Fill It Up"
    module: Color
    description: "Color a circle using fill() with RGB values."
    instruction: |
      Draw a circle filled with hot pink.
      Use fill(r, g, b) before circle() to set the color.
      Try fill(255, 105, 180) for hot pink.
    startingCode: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(255);
        circle(200, 200, 150);
      }
    solution: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(255);
        fill(255, 105, 180);
        circle(200, 200, 150);
      }
    tasks:
      - id: task-1
        title: "Add Fill Color"
        instruction: |
          Add fill(255, 105, 180) before the circle() call to make it hot pink.
        validation:
          - type: functionCall
            name: fill
            exactArgs: 3
          - type: functionCall
            name: circle
            exactArgs: 3
          - type: pixelMatch
            x: 200
            y: 200
            expected: [255, 105, 180]
            tolerance: 120
  - id: exercise-2
    title: "Stroke Story"
    module: Color
    description: "Add outlines to shapes with stroke() and strokeWeight()."
    instruction: |
      Add a thick red outline to the rectangle.
      Use stroke(255, 0, 0) and strokeWeight(5) before rect().
    startingCode: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(240);
        fill(100, 200, 255);
        noStroke();
        rect(100, 100, 200, 200);
      }
    solution: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(240);
        fill(100, 200, 255);
        stroke(255, 0, 0);
        strokeWeight(5);
        rect(100, 100, 200, 200);
      }
    tasks:
      - id: task-1
        title: "Add Stroke"
        instruction: |
          Replace noStroke() with stroke(255, 0, 0) and add strokeWeight(5).
        validation:
          - type: functionCall
            name: stroke
            exactArgs: 3
          - type: functionCall
            name: strokeWeight
            exactArgs: 1
  - id: exercise-3
    title: "No Fill No Problem"
    module: Color
    description: "Draw outlines only with noFill(), or filled shapes with noStroke()."
    instruction: |
      Draw two circles side by side.
      The left one should be outline-only (noFill + stroke).
      The right one should be filled but no outline (fill + noStroke).
    startingCode: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(255);
      }
    solution: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(255);
        noFill();
        stroke(0);
        strokeWeight(3);
        circle(130, 200, 120);
        fill(50, 150, 255);
        noStroke();
        circle(270, 200, 120);
      }
    tasks:
      - id: task-1
        title: "Outline Circle"
        instruction: |
          Draw an outline-only circle at (130, 200) with diameter 120.
          Use noFill(), stroke(0), strokeWeight(3), then circle(130, 200, 120).
        validation:
          - type: functionCall
            name: noFill
            exactArgs: 0
          - type: functionCall
            name: circle
            exactArgs: 3
      - id: task-2
        title: "Filled Circle"
        instruction: |
          Draw a filled circle at (270, 200) with no outline.
          Use fill(50, 150, 255), noStroke(), then circle(270, 200, 120).
        validation:
          - type: functionCall
            name: noStroke
            exactArgs: 0
          - type: functionCall
            name: fill
            exactArgs: 3
          - type: pixelMatch
            x: 270
            y: 200
            expected: [50, 150, 255]
            tolerance: 120
  - id: exercise-4
    title: "Color Mode Explorer"
    module: Color
    description: "Switch to HSB color mode for intuitive color selection."
    instruction: |
      Switch to HSB color mode using colorMode(HSB).
      Then fill the circle with a hue-based color: fill(180, 255, 255) for cyan.
    startingCode: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(255);
        circle(200, 200, 200);
      }
    solution: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(255);
        colorMode(HSB);
        fill(180, 255, 255);
        circle(200, 200, 200);
      }
    tasks:
      - id: task-1
        title: "Switch to HSB"
        instruction: |
          Add colorMode(HSB) in draw(), then use fill(180, 255, 255) to draw a cyan circle.
        validation:
          - type: functionCall
            name: colorMode
            exactArgs: 1
          - type: functionCall
            name: fill
            exactArgs: 3
  - id: exercise-5
    title: "Background Bliss"
    module: Color
    description: "Set a custom background color to change the canvas appearance."
    instruction: |
      Set a dark blue background using background(20, 30, 80).
      Then draw a bright yellow circle on top.
    startingCode: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        fill(255, 255, 0);
        circle(200, 200, 150);
      }
    solution: |
      function setup() {
        createCanvas(400, 400);
      }

      function draw() {
        background(20, 30, 80);
        fill(255, 255, 0);
        circle(200, 200, 150);
      }
    tasks:
      - id: task-1
        title: "Set Background"
        instruction: |
          Add background(20, 30, 80) at the start of draw() for a dark blue canvas.
        validation:
          - type: functionCall
            name: background
            exactArgs: 3
          - type: pixelMatch
            x: 10
            y: 10
            expected: [20, 30, 80]
            tolerance: 30
